name: Draft Release and Upload Assets

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write # Required permission to create releases and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetches full history for accurate release notes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Step 1: Run pytest (non-blocking) ---
      - name: Run Tests
        run: pytest -v
        continue-on-error: true # Test failures will be logged but won't halt the release pipeline

      # --- Step 2: Build Release Package ---
      - name: Build Release Package
        run: |
          mkdir -p dist
          # Package project Python files, trained models (.pkl), datasets (.csv), configs, and tests
          tar -czvf dist/customer_segmentation_v1.tar.gz *.py *.pkl *.csv pyproject.toml requirements.txt tests/

      # --- Step 3: Create GitHub Release ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist/customer_segmentation_v1.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}